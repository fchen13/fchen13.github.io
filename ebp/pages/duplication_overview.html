<head>
  <meta charset="utf-8">

  <meta name="robots" content="noindex">

  <!--
    A REDIRECT STUB, and the one file in this tree named against its own rule.

    This page was `duplication_overview.html` until 2026-09-12, when it was
    renamed `duplication.html` so the two tools' URLs read alike. The rename left
    nothing pointing here — config.js, the topnav and the landing page were all
    updated — but links already sent or bookmarked do not get updated by a rename,
    and a 404 tells the reader nothing about where the page went.

    JS does the redirect rather than the <meta refresh> below, for one reason:
    `?project=<key>` is how a duplication link is useful at all, and a static
    meta refresh cannot carry a query string it cannot see. `location.replace`
    also REPLACES this entry in history rather than pushing one, so Back from
    the new page goes where the reader came from instead of bouncing through
    here again. The meta refresh is the no-JS fallback and does drop the query —
    acceptable, because the page it leads to cannot run without JS either.

    Delete this file once nothing links here. Nothing here depends on it.
  -->
  <meta http-equiv="refresh" content="1; url=./duplication.html">
  <script>
    location.replace('./duplication.html' + location.search + location.hash);
  </script>

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      color: #111827;
      background: #ffffff;

      line-height: 1.6;

    .box { max-width: 34rem; margin: 0 auto; }

    p { margin: 0.5rem 0; color: #4b5563; font-size: 0.95rem; }

    code { background: #f4f6f4; padding: 0.1rem 0.3rem; border-radius: 3px; font-size: 0.9em; }
  </style>
</head>

</body>
