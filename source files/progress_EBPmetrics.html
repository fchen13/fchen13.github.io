<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="copyright" content="Data source: Genomes on a Tree (GoaT). Used with permission." />
    <meta name="author" content="Fang Chen" />
    <title>EBP Contribution to Assemblies Meeting EBP Metrics</title>
    <script src="../config.js"></script>
    <script src="./echarts.min.js"></script>
    <script src="./utils.js"></script>
    <script src="./services.js"></script>
    <script>
      // Initialize top chart (Phylum, Class, Order)
      function initTopChart(data, annimationDelay) {
        console.log('Initializing top chart with data:', data);
        const chartDom = document.getElementById("topChartContainer");
        const myChart = echarts.init(chartDom);
        const option = {
          title: {
            text: 'Assemblies meeting EBP-standard metrics',
            left: 'center',
            top: -5,
            textStyle: {
              fontSize: 20,
              fontWeight: 'bold'
            }
          },
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'shadow'
            },
            formatter: function(params) {
              const ebp = params[0].value;
              const nonEbp = params[1].value;
              const total = ebp + nonEbp;
              const ebpPercentage = ((ebp / total) * 100).toFixed(1);
              const nonEbpPercentage = ((nonEbp / total) * 100).toFixed(1);
              return `<b>${params[0].name}</b><br/>` +
                     `Total counts: ${total}<br/>` +
                     `EBP contribution: ${ebp} (${ebpPercentage}%)<br/>` +
                     `Non-EBP contribution: ${nonEbp} (${nonEbpPercentage}%)`;
            },
            textStyle: {
              fontSize: 14
            },
            extraCssText: 'box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);'
          },
          legend: {
            data: [
              {
                name: 'EBP Contribution',
                itemStyle: {
                  color: '#2E7D8F'  // Deeper, more saturated teal color matching the image
                }
              }, 
              {
                name: 'Non-EBP Contribution',
                itemStyle: {
                  color: '#7CBDD3'  // More saturated lighter teal color matching the image
                }
              }
            ],
            top: 35,
            textStyle: {
              fontSize: 14,
              fontWeight: 'bold'
            }
          },
          grid: {
            left: '10%',    
            right: '15%',   
            bottom: '0%',
            top: '25%',     
            containLabel: true
          },
          xAxis: {
            type: 'value',
            min: 0,
            max: 'dataMax',
            position: 'top',  // Position x-axis at the top
            interval: 100,  // Set tick interval to 100
            axisLine: { show: true },
            axisLabel: {
              formatter: function(value) {
                // Only show values that are multiples of 100
                if (value % 100 === 0) {
                  return value;
                }
                return '';  // Hide non-multiple values
              },
              margin: 10,
              fontSize: 14,
            },
            splitLine: {
              show: false
            },
            axisTick: {
              show: true,
              alignWithLabel: true
            }
          },
          yAxis: {
            type: 'category',
            data: ['Order', 'Class', 'Phylum'],
            axisLine: { show: true },
            axisTick: { show: false },
            axisLabel: {
              fontSize: 14,
              fontWeight: 'bold',
              margin: 16
            }
          },
          series: data
        };

        myChart.setOption(option);
      }

      // Initialize bottom chart (Family, Genus, Species)
      function initBottomChart(data, annimationDelay) {
        console.log('Initializing bottom chart with data:', data);
        const chartDom = document.getElementById("bottomChartContainer");
        const myChart = echarts.init(chartDom);
        const option = {
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'shadow'
            },
            formatter: function(params) {
              const ebp = params[0].value;
              const nonEbp = params[1].value;
              const total = ebp + nonEbp;
              const ebpPercentage = ((ebp / total) * 100).toFixed(1);
              const nonEbpPercentage = ((nonEbp / total) * 100).toFixed(1);
              return `<b>${params[0].name}</b><br/>` +
                     `Total counts: ${total}<br/>` +
                     `EBP contribution: ${ebp} (${ebpPercentage}%)<br/>` +
                     `Non-EBP contribution: ${nonEbp} (${nonEbpPercentage}%)`;
            },
            textStyle: {
              fontSize: 14
            },
            extraCssText: 'box-shadow: 0 0 8px rgba(0, 0, 0, 0.3);'
          },
          grid: {
            left: '10%',    
            right: '15%',   
            bottom: '10%',
            top: '10%',     
            containLabel: true
          },
          xAxis: {
            type: 'value',
            min: 0,
            max: 'dataMax',
            position: 'bottom',  // Position x-axis at the bottom
            interval: 1000,  // Set tick interval to 1000
            axisLine: { show: true },
            axisLabel: {
              formatter: function(value) {
                // Only show values that are multiples of 1000
                if (value % 1000 === 0) {
                  return value;
                }
                return '';  // Hide non-multiple values
              },
              margin: 10,
              fontSize: 14,
            },
            splitLine: {
              show: false
            },
            axisTick: {
              show: true,
              alignWithLabel: true
            }
          },
          yAxis: {
            type: 'category',
            data: ['Species', 'Genus', 'Family'],
            axisLine: { show: true },
            axisTick: { show: false },
            axisLabel: {
              fontSize: 14,
              fontWeight: 'bold',
              margin: 16
            }
          },
          series: data
        };

        myChart.setOption(option);
      }

      function getGraphicOption(type, data) {
        if(type == 'text') {
          return {
              type: 'text',
              z: 100,
              left: 0,
              top: 0,
              style: {
                text: `${data.text}`,
                textAlign: 'center',
                textVerticalAlign: 'middle',
                fontSize: 10,
                fill: data.color
              }
          }
        } else if(type == 'rect') {
          return {
            type: "rect",
            left: 0,
            top: 0,
            shape: {
              width: 16,
              height: 10,
              r: 3,
            },
            style: {
              fill: data.color,
              stroke: null,
            },
            silent: true,
          }
        }
      }

      function initLegendChart(legends) {
        // Empty function as we're not showing statistics for now
      }

      window.onload = function () {
        console.log('Window loaded, starting data fetch...');
        
        // Define URLs for Total Counts with Assemblies Meeting EBP Metrics
        const totalUrls = [
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20tax_rank%28phylum%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=contig_n50&excludeMissing%5B1%5D=scaffold_n50&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20tax_rank%28class%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=contig_n50&excludeMissing%5B1%5D=scaffold_n50&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20tax_rank%28order%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=contig_n50&excludeMissing%5B1%5D=scaffold_n50&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20tax_rank%28family%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=contig_n50&excludeMissing%5B1%5D=scaffold_n50&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20tax_rank%28genus%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=contig_n50&excludeMissing%5B1%5D=scaffold_n50&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20tax_rank%28species%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=contig_n50&excludeMissing%5B1%5D=scaffold_n50&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0'
        ];

        // Define URLs for EBP contributions
        const ebpUrls = [
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20bioproject%3DPRJNA533106%20AND%20tax_rank%28phylum%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&excludeAncestral%5B0%5D=bioproject&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20bioproject%3DPRJNA533106%20AND%20tax_rank%28class%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&excludeAncestral%5B0%5D=bioproject&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20bioproject%3DPRJNA533106%20AND%20tax_rank%28order%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&excludeAncestral%5B0%5D=bioproject&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20bioproject%3DPRJNA533106%20AND%20tax_rank%28family%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&excludeAncestral%5B0%5D=bioproject&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20bioproject%3DPRJNA533106%20AND%20tax_rank%28genus%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&excludeAncestral%5B0%5D=bioproject&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0',
          'https://goat.genomehubs.org/api/v2/search?result=taxon&query=contig_n50%3E%3D1000000%20AND%20scaffold_n50%3E%3D10000000%20AND%20bioproject%3DPRJNA533106%20AND%20tax_rank%28species%29&taxonomy=ncbi&includeEstimates=true&excludeMissing%5B0%5D=bioproject&excludeAncestral%5B0%5D=bioproject&fields=contig_n50%2Cscaffold_n50%2Cbioproject&report=arc&summaryValues=count&offset=0'
        ];

        const annimationDelay = 2000; //ms

        // Fetch and process data
        Promise.all([
          Promise.all(totalUrls.map(url => fetch(url).then(res => res.json()))),
          Promise.all(ebpUrls.map(url => fetch(url).then(res => res.json())))
        ])
        .then(([totalResults, ebpResults]) => {
          console.log('Total Results:', totalResults);
          console.log('EBP Results:', ebpResults);
          
          const ebpData = [];
          const nonEbpData = [];
          const ranks = ['Species', 'Genus', 'Family', 'Order', 'Class', 'Phylum'];
          
          ranks.forEach((rank, index) => {
            // Get total count and EBP count
            const total = totalResults[5-index].status.hits;
            const ebp = ebpResults[5-index].status.hits;
            const nonEbp = total - ebp;  // Calculate non-EBP count
            
            console.log(`Rank: ${rank}, Total: ${total}, EBP: ${ebp}, Non-EBP: ${nonEbp}`);
            
            ebpData.push(ebp);
            nonEbpData.push(nonEbp);
          });

          // Split data for top panel (Phylum, Class, Order) - indices 5, 4, 3
          const topEbpData = [ebpData[3], ebpData[4], ebpData[5]];  // Order, Class, Phylum
          const topNonEbpData = [nonEbpData[3], nonEbpData[4], nonEbpData[5]];  // Order, Class, Phylum
          
          // Split data for bottom panel (Family, Genus, Species) - indices 2, 1, 0
          const bottomEbpData = [ebpData[0], ebpData[1], ebpData[2]];  // Species, Genus, Family
          const bottomNonEbpData = [nonEbpData[0], nonEbpData[1], nonEbpData[2]];  // Species, Genus, Family

          function createSeriesData(ebpDataArray, nonEbpDataArray) {
            return [
              {
                name: 'EBP Contribution',
                type: 'bar',
                stack: 'total',
                itemStyle: {
                  color: '#2E7D8F',  // Deeper, more saturated teal color matching the image
                  borderColor: 'transparent',
                  borderWidth: 0
                },
                label: {
                  show: true,  // Enable numbers and percentages display
                  position: 'inside',
                  align: 'center',
                  verticalAlign: 'middle',
                  color: '#ffffff',  // White text for better contrast on dark background
                  formatter: function(params) {
                    const total = params.value + nonEbpDataArray[params.dataIndex];
                    const percentage = ((params.value / total) * 100).toFixed(1);
                    return `{a|${params.value}}\n{b|(${percentage}%)}`;
                  },
                  rich: {
                    a: {
                      fontSize: 14,
                      lineHeight: 20,
                      fontWeight: 'bold',
                      align: 'center',
                      fontFamily: 'Arial, sans-serif',
                      color: '#ffffff'
                    },
                    b: {
                      fontSize: 12,
                      lineHeight: 18,
                      fontWeight: 'normal',
                      align: 'center',
                      fontFamily: 'Arial, sans-serif',
                      color: '#ffffff'
                    }
                  }
                },
                data: ebpDataArray
              },
              {
                name: 'Non-EBP Contribution',
                type: 'bar',
                stack: 'total',
                itemStyle: {
                  color: '#7CBDD3',  // More saturated lighter teal color matching the image
                  borderColor: 'transparent',
                  borderWidth: 0
                },
                label: {
                  show: true,  // Enable numbers and percentages display
                  position: 'inside',
                  align: 'center',
                  verticalAlign: 'middle',
                  color: '#ffffff',  // Dark text for better contrast on light background
                  formatter: function(params) {
                    const total = params.value + ebpDataArray[params.dataIndex];
                    const percentage = ((params.value / total) * 100).toFixed(1);
                    return `{a|${params.value}}\n{b|(${percentage}%)}`;
                  },
                  rich: {
                    a: {
                      fontSize: 14,
                      lineHeight: 20,
                      fontWeight: 'bold',
                      align: 'center',
                      fontFamily: 'Arial, sans-serif',
                      color: '#ffffff'
                    },
                    b: {
                      fontSize: 12,
                      lineHeight: 18,
                      fontWeight: 'normal',
                      align: 'center',
                      fontFamily: 'Arial, sans-serif',
                      color: '#ffffff'
                    }
                  }
                },
                data: nonEbpDataArray
              }
            ];
          }

          const topSeries = createSeriesData(topEbpData, topNonEbpData);
          const bottomSeries = createSeriesData(bottomEbpData, bottomNonEbpData);

          console.log('Top series data:', topSeries);
          console.log('Bottom series data:', bottomSeries);
          
          return { 
            topData: topSeries, 
            bottomData: bottomSeries, 
            legends: [] 
          };
        })
        .then(({ topData, bottomData, legends }) => {
          console.log('Initializing charts with data');
          // Draw charts
          initTopChart(topData, annimationDelay);
          initBottomChart(bottomData, annimationDelay);
          initLegendChart(legends);
        })
        .catch(error => {
          console.error('Error:', error);
        });
      };
    </script>
    <style>
      .charts-container {
        width: 80%;
        margin: 0px auto 60px auto;
      }
      
      #topChartContainer {
        width: 100%;
        height: 280px;
        margin-bottom: 0;
        margin-top: 20px;
      }
      
      #bottomChartContainer {
        width: 100%;
        height: 280px;
        margin-top: 0;
      }
      
      #legendContainer {
        display: none;
      }
      
      /* Add container padding to prevent footer overlap */
      .container {
        padding-bottom: 30px;
      }

      /* Footer styles */
      #footer {
        position: fixed;
        bottom: 0;
        width: 100%;
        background-color: rgba(248, 249, 250, 0.95);
        color: #333;
        text-align: center;
        padding: 5px;
        z-index: 9999;
        box-shadow: 0 -2px 5px rgba(0,0,0,0.1);
        font-size: 14px;  /* Changed from 12px */
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="charts-container">
        <div id="topChartContainer"></div>
        <div id="bottomChartContainer"></div>
      </div>
      <div id="legendContainer"></div>
    </div>
    <div id="footer">
        <div id="copyright">Data source: Genomes on a Tree (GoaT). Used with permission.</div>
    </div>
  </body>
</html>
