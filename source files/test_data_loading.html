<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Loading Test</title>
</head>
<body>
    <h1>Data Loading Test Results</h1>
    <div id="results"></div>

    <!-- Test the problematic file -->
    <script src="./geoMap/EBPnetwork_20250807.js"></script>
    
    <script>
        const resultsDiv = document.getElementById('results');
        let html = '';
        
        try {
            // Test if projectsData is loaded
            if (typeof projectsData === 'undefined') {
                html += '<p style="color: red;">❌ ERROR: projectsData is undefined</p>';
            } else {
                html += '<p style="color: green;">✅ SUCCESS: projectsData loaded</p>';
                html += `<p>Total records: ${projectsData.length}</p>`;
                
                // Check data structure
                if (projectsData.length > 0) {
                    const firstRecord = projectsData[0];
                    html += `<p>First record: ${JSON.stringify(firstRecord, null, 2)}</p>`;
                    
                    // Check for required fields
                    const requiredFields = ['projectName', 'type', 'latitude', 'longitude'];
                    const missingFields = requiredFields.filter(field => !(field in firstRecord));
                    
                    if (missingFields.length > 0) {
                        html += `<p style="color: red;">❌ Missing fields: ${missingFields.join(', ')}</p>`;
                    } else {
                        html += '<p style="color: green;">✅ All required fields present</p>';
                    }
                    
                    // Check project types
                    const types = {};
                    projectsData.forEach(record => {
                        const type = record.type || 'Unknown';
                        types[type] = (types[type] || 0) + 1;
                    });
                    html += `<p>Project types: ${JSON.stringify(types, null, 2)}</p>`;
                    
                    // Check for Center type (this is important for WireMaps)
                    const centerProjects = projectsData.filter(p => p.type === 'Center');
                    html += `<p>Center projects: ${centerProjects.length}</p>`;
                    if (centerProjects.length > 0) {
                        html += `<p>Center project: ${JSON.stringify(centerProjects[0], null, 2)}</p>`;
                    }
                    
                    // Check for invalid coordinates
                    const invalidCoords = projectsData.filter(record => 
                        typeof record.latitude !== 'number' || 
                        typeof record.longitude !== 'number' ||
                        isNaN(record.latitude) || 
                        isNaN(record.longitude)
                    );
                    
                    if (invalidCoords.length > 0) {
                        html += `<p style="color: red;">❌ Invalid coordinates in ${invalidCoords.length} records</p>`;
                        html += `<p>Sample invalid record: ${JSON.stringify(invalidCoords[0], null, 2)}</p>`;
                    } else {
                        html += '<p style="color: green;">✅ All coordinates valid</p>';
                    }
                }
            }
        } catch (error) {
            html += `<p style="color: red;">❌ ERROR: ${error.message}</p>`;
            console.error('Error:', error);
        }
        
        resultsDiv.innerHTML = html;
    </script>
</body>
</html>
